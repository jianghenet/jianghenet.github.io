<!DOCTYPE HTML>
<html>

<head>
  <meta charset="UTF-8">
  <title>中国象棋</title>

  <link href="css/chess.css" rel="stylesheet" type="text/css">
  <!--[if lt IE 9]>
  <script> alert("对不起，您的浏览器不支持HTML5，请升级浏览器至微软Edge、FireFox或者谷歌浏览器！")</script>
  < ![endif]-->
</head>

<body>
  <div id="chessBox" class="chess_box">
    <canvas id="chess"></canvas>
    <audio src="audio/click.wav" id="clickAudio" preload="auto"></audio>
    <audio src="audio/select.wav" id="selectAudio" preload="auto"></audio>
    <div class="bn_box" id="bnBox">
      <input type="button" name="restartBtn" id="restartBtn" value="  重新开始  " />
      <input type="button" name="gohomeBtn" id="gohomeBtn" value="  返回首页  " />
      <input type="button" name="regretBtn" id="regretBtn" value="  悔   棋  " />
    </div>
  </div>
  <div class="menu_box" id="menuBox">
    <div class="menu_init" id="indexBox"><button id="indexDy">人机对弈</button><button id="indexQj">挑战棋局</button><button
        id="stypeBtn">更换皮肤</button></div>
    <div class="menu_dy" id="menuDy">
      <div class="menu_info">
        <div class="menu_fh" id="menuFh">X</div>
        <!-- 添加选择先手/后手的选项 -->
        <div class="player_side_selection" id="playerSideSelection">
          <h4>选择先后手：</h4>
          <label>
            <input name="playerSide" type="radio" value="first" checked>
            执红先行
          </label>
          <br />
          <label>
            <input name="playerSide" type="radio" value="second">
            执黑后行
          </label>
          <div id="playerSideText" class="player_side_text">当前选择：执红先行</div>
        </div>
        <label>
          <input name="depth" type="radio" value="2">
          菜鸟水平
        </label>
        <br />
        <label>
          <input name="depth" type="radio" value="3" checked>
          中级水平
        </label>
        <br />
        <label>
          <input name="depth" type="radio" value="4">
          高手水平
        </label>
        <br />
        <label>
          <input name="depth" type="radio" value="5">
          资深水平
        </label>
        <br />
        <label>
          <input name="depth" type="radio" value="6">
          专业水平
        </label>
        <br />
        <label>
          <input name="depth" type="radio" value="7">
          专业高段
        </label>
      </div>
      <button id="playBtn">开始对弈</button>
    </div>
    <div class="menu_qj" id="menuQj">
      <div class="menu_info">
        <div class="menu_fh" id="menuGb">X</div>
        <label>
          <input name="clasli" type="radio" value="0" checked>
          八卦阵法</label>
        <br />
        <label>
          <input name="clasli" type="radio" value="1">
          很二棋局</label>
        <br />
        <label>
          <input name="clasli" type="radio" value="2">
          七星会阵</label>
        <br />
        <label>
          <input name="clasli" type="radio" value="3">
          测试阵法</label>
      </div>
      <button id="clasliBtn">开始挑战</button>
    </div>
  </div>
  <script src="js/game.js"></script>

</body>

</html>
